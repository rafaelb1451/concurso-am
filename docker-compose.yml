services:
  # ---------------------------------------------------------------- banco
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qb}
      POSTGRES_USER: ${POSTGRES_USER:-qb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - pg_dados:/var/lib/postgresql/data
    # SEM "ports": o banco vive so' na rede interna do compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qb} -d ${POSTGRES_DB:-qb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------- aplicacao
  app:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    image: qb-concurso:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_TOKEN: ${MP_WEBHOOK_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_NOTIFICATION_URL: ${MP_NOTIFICATION_URL:-}
      PAGBANK_TOKEN: ${PAGBANK_TOKEN:-}
      PAGBANK_BASE_URL: ${PAGBANK_BASE_URL:-https://api.pagseguro.com}
      PAGBANK_WEBHOOK_URL: ${PAGBANK_WEBHOOK_URL:-https://qbconcurso.com.br/api/webhooks/pagbank}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      CONCURSO_APP_URL: ${CONCURSO_APP_URL:-http://localhost:8080}
      SPRING_PROFILES_ACTIVE: prod
      # conexao com o Postgres (credenciais vindas do .env)
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-qb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-qb}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      DDL_AUTO: ${DDL_AUTO:-update}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-false}
    volumes:
      # apenas a chave do tutor fica em disco; o banco agora e' o Postgres
      - dados:/dados
    stop_grace_period: 30s
    # SEM "ports": o app só é alcançável pela rede interna do compose.
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------- porta de entrada
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMINIO: ${DOMINIO}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pg_dados:
  dados:
  caddy_dados:
  caddy_config:
