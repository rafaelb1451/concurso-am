services:
  app:
    build: .
    image: qb-concurso:latest
    restart: unless-stopped
    environment:
      # a chave vem do arquivo .env do servidor; nunca da imagem
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      SPRING_PROFILES_ACTIVE: prod
    volumes:
      - dados:/dados
    # SEM "ports": o app só é alcançável pela rede interna do compose.
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMINIO: ${DOMINIO}
      QB_USUARIO: ${QB_USUARIO}
      QB_SENHA_HASH: ${QB_SENHA_HASH}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dados:
  caddy_dados:
  caddy_config:
