# Perfil de producao (container).
#
# Banco: PostgreSQL (servico `db` do compose). O H2 saiu de producao — em arquivo
# unico ele nao suporta concorrencia de usuarios nem backup point-in-time.
#
# Etapa de transicao: o schema ainda e' criado pelo Hibernate (ddl-auto=update).
# Depois do primeiro boot contra o Postgres, gera-se o baseline do Flyway a partir
# do banco real (ver DEPLOY.md, Etapa B) e troca-se para ddl-auto=validate.

server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,text/plain
  tomcat:
    max-http-form-post-size: 200KB
    max-swallow-size: 200KB
    threads:
      max: 200
    accept-count: 100

spring:
  application:
    name: concurso-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/qb}
    username: ${SPRING_DATASOURCE_USERNAME:qb}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:12}
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000
      pool-name: qb-pool

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 30
          time_zone: UTC
        order_inserts: true
        order_updates: true

  flyway:
    # habilite depois de gerar o baseline (DEPLOY.md, Etapa B)
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  mvc:
    problemdetails:
      enabled: false

concurso:
  app:
    url: ${CONCURSO_APP_URL:http://localhost:8080}
  asaas:
    api-key: ${ASAAS_API_KEY:}
    chave-arquivo: ${ASAAS_CHAVE_ARQUIVO:}
    base-url: ${ASAAS_BASE_URL:https://api.asaas.com/v3}
    webhook-token: ${ASAAS_WEBHOOK_TOKEN:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  seed:
    arquivo: seed-completo.json
  tutor:
    # o root filesystem do container e' read-only; a chave colada na tela vai para o volume
    chave-arquivo: /dados/segredos/deepseek.key

logging:
  level:
    root: INFO
    com.concurso: INFO
    org.hibernate: WARN
    org.flywaydb: INFO
