# Login com Google (Google Identity Services). Sem o Client ID, /api/google responde 503
# e o login por e-mail/senha continua funcionando normalmente.
concurso:
  acesso:
    # Feature flag de canario/rollback do escopo por certame.
    # true  = regra nova (conteudo filtrado pelos certames contratados).
    # false = comportamento antigo (sem escopo: todo conteudo visivel), para
    #         desligar em emergencia via ACESSO_ESCOPO_POR_CERTAME=false.
    escopo-por-certame: ${ACESSO_ESCOPO_POR_CERTAME:true}
  pagbank:
    token: ${PAGBANK_TOKEN:}
    base-url: ${PAGBANK_BASE_URL:https://api.pagseguro.com}
    webhook-url: ${PAGBANK_WEBHOOK_URL:https://qbconcurso.com.br/api/webhooks/pagbank}
  # URL publica usada em canonical, sitemap e JSON-LD das paginas de SEO.
  seo:
    url: ${SEO_BASE_URL:https://qbconcurso.com.br}
  mercadopago:
    access-token: ${MP_ACCESS_TOKEN:}
    webhook-token: ${MP_WEBHOOK_TOKEN:}
    webhook-secret: ${MP_WEBHOOK_SECRET:}
    base-url: ${MP_BASE_URL:https://api.mercadopago.com}
    # URL publica que o MP chama apos o pagamento (com ?token=...)
    notification-url: ${MP_NOTIFICATION_URL:}
  email:
    remetente: ${SMTP_FROM:}
  app:
    # URL publica usada nos callbacks do checkout (o Asaas exige https)
    url: ${CONCURSO_APP_URL:http://localhost:5173}
  asaas:
    api-key: ${ASAAS_API_KEY:}
    # no dev a chave fica em backend/segredos/asaas.key (gitignored)
    chave-arquivo: ${ASAAS_CHAVE_ARQUIVO:segredos/asaas.key}
    base-url: ${ASAAS_BASE_URL:https://api-sandbox.asaas.com/v3}
    # token que o Asaas envia no header asaas-access-token; sem ele o webhook recusa tudo
    webhook-token: ${ASAAS_WEBHOOK_TOKEN:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  # Seeds opcionais: sem o arquivo, o boot segue normalmente.
  seed:
    extra-arquivo: classpath:seed-extra.json
  materiais:
    arquivo: classpath:materiais.json

server:
  port: 8080

spring:
  application:
    name: concurso-backend
  datasource:
    url: jdbc:h2:file:./data/concurso
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  flyway:
    # Desligado no perfil padrao (dev/testes com H2): a migration V1 e' SQL de
    # PostgreSQL. O perfil prod define spring.flyway.enabled via FLYWAY_ENABLED.
    enabled: false

logging:
  level:
    com.concurso: INFO
