server:
  port: 8080

spring:
  application:
    name: concurso-backend
  datasource:
    url: jdbc:h2:file:./data/concurso
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

logging:
  level:
    com.concurso: INFO
